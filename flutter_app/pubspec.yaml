name: ai_video_call_flutter
description: "Real-time AI Video Calling App with Multilingual Live Subtitles, Speech Recognition (STT), and Neural Text-to-Speech (TTS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.11.7
  socket_io_client: ^3.0.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  http: ^1.2.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
